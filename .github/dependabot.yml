# Notes on Dependabot version updates
#
# **Github Actions Policy**: only merge PRs generated by Dependabot if they
# are 7+ days old.
#
# There are some open issues with the `cooldown` feature for Github Actions.
# Consequently, the Dependabot configuration (`dependabot.yml`) lets
# Dependabot check for updates on Github Actions every month. We implement a
# manual "cooldown" by delaying merging of Dependabot PRs by 7 days.
#
# For `pip` packages, we use the cooldown feature, set to 7 days.


version: 2
updates:
  # Enable version updates for GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    groups:
      github-actions:
        patterns:
          - "*"
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    groups:
      pip-packages:
        patterns:
          - "*"
    ignore:
      - dependency-name: "django"
        versions: [ ">=6.0.0" ]
